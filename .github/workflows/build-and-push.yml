name: Build & Push Image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'The image tag'
        required: false
        default: '2025-latest'

permissions:
  contents: read

# Single source of truth for the Trivy scanner version used by every scan
# step (SARIF scan, Copa report scan, verify gate).
# Note: must include the leading "v" — it is passed verbatim to Trivy's
# contrib/install.sh via setup-trivy, which loads
# github.com/aquasecurity/trivy/releases/<version> and fails with
# "unable to find '...'" when the tag does not exist verbatim.
env:
  TRIVY_VERSION: v0.76.2

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish Trivy SARIF results to the code scanning Security tab.
      security-events: write
    env:
      IMG_NAME: ''
      IMAGE_REPO: docker.io/${{ vars.USERNAME }}/${{ vars.IMG_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.USERNAME }}
          password: ${{ secrets.PAT }}

      # Only the immutable, commit-pinned sha tag is published at build time.
      # The image-tag/latest tags below are applied to the FINAL image (original
      # or Copa-patched) by the promotion step, after the Trivy scan + Copacetic
      # patch + verify gate passes. This keeps vulnerable images out of the
      # versioned/latest tags even when the image itself is already in the
      # registry under its sha tag.
      - name: Build and push commit-pinned image
        shell: bash
        run: docker buildx build --push -t "${{ env.IMAGE_REPO }}:${{ github.sha }}" .

      # ---------------------------------------------------------------------------
      # Vulnerability scanning & auto-remediation pipeline:
      #
      #   1. Trivy scans the just-pushed image (full vuln scan -> SARIF -> code
      #      scanning) and again with an OS-packages-only, fixable-only JSON
      #      report sized for Copacetic.
      #   2. If fixable OS-package vulnerabilities were found, copa patches the
      #      image in place (adds a lightweight patch layer via apt/zypper/dnf)
      #      and pushes it alongside the original, together with an OpenVEX
      #      record of what it remediated.
      #   3. A verify rescan acts as the release gate: the job fails if fixable
      #      HIGH/CRITICAL OS vulnerabilities remain after patching.
      #   4. A functional smoke test runs the final image exactly the way
      #      consumers do (data & log dirs on tmpfs) and fails unless SQL
      #      Server actually starts and serves queries from tmpfs-backed
      #      storage.
      #   5. Only after the gate passes are the promoted tags (image-tag input,
      #      plus latest on master) applied to the final image via
      #      `docker buildx imagetools create` (server-side, digest-based).
      #
      # Supply-chain note: trivy-action was compromised in March 2026
      # (GHSA-69fq-xp46-6x23); v0.35.0+ are the clean releases. The action is
      # therefore pinned to the immutable SHA of v0.36.0, never a mutable tag.
      # ---------------------------------------------------------------------------

      - name: Scan image with Trivy (full vuln scan, SARIF output)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          format: sarif
          output: trivy-full.sarif
          scanners: vuln
          # Pin the scanner version explicitly rather than riding the action's
          # per-release default; setup-trivy then caches the binary too.
          # TRIVY_VERSION (workflow-level env) is the single source of truth.
          version: ${{ env.TRIVY_VERSION }}

      - name: Upload SARIF results to GitHub Code Scanning
        # continue-on-error: code scanning upload requires GitHub Advanced
        # Security on private repos; a missing GHAS license must not block
        # releases. The actual release gate is the dedicated verify step below.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-full.sarif
          category: trivy-mssql-server-tmpfs

      - name: Scan image with Trivy (fixable OS packages, JSON for Copa)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          format: json
          output: trivy-os-pkgs-report.json
          # Copa can only patch OS packages (dpkg/rpm/zypper); language/library
          # findings require rebuilding the Dockerfile instead.
          vuln-type: os
          # Fixable-only: unfixed findings are upstream/base-image issues that
          # cannot be remediated here; gate policy excludes them.
          ignore-unfixed: true
          version: ${{ env.TRIVY_VERSION }}

      - name: Count fixable OS-package vulnerabilities
        id: vulns
        shell: bash
        env:
          REPORT: trivy-os-pkgs-report.json
        run: |
          set -euo pipefail
          count="$(jq '[.Results[]? | select(.Class == "os-pkgs" and .Vulnerabilities != null) | .Vulnerabilities[]] | length' "$REPORT")"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [[ "$count" -gt 0 ]]; then
            echo "::notice::Found ${count} fixable OS-package vulnerabilities; Copa patching will run."
          else
            echo "::notice::No fixable OS-package vulnerabilities found; skipping Copa patching."
          fi

      - name: Patch image OS packages with Copa
        # Only runs when the scan found patchable OS-package vulnerabilities.
        if: ${{ steps.vulns.outputs.count != '0' }}
        id: copa
        uses: project-copacetic/copa-action@3843e22efdca421adb37aa8dec103a0f1db68544 # v1.2.1
        with:
          image: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          image-report: trivy-os-pkgs-report.json
          patched-tag: copa-${{ github.sha }}
          # Pin Copa explicitly; the action otherwise resolves "latest" from
          # the GitHub API at runtime, which is an unpinned supply chain.
          copa-version: 0.15.0
          # Free extra headroom beyond the 5m default: zypper/dpkg refreshes on
          # full distro images can be slow.
          timeout: 15m
          # OpenVEX record of remediated vulnerabilities (audit trail).
          output: vex-report.json
          format: openvex

      - name: Push Copa-patched image to registry
        # copa-action never passes copa's --push flag, and copa without
        # --push only exports the patched image into the runner's local
        # Docker image store ("exporting to docker image format"). The
        # registry therefore never sees the copa-<sha> tag, which breaks
        # the promotion step (docker buildx imagetools create reads only
        # from the registry) with "not found". Push it here; the runner's
        # docker CLI already holds registry credentials from the login
        # step above.
        if: ${{ steps.vulns.outputs.count != '0' }}
        shell: bash
        run: docker push "${{ steps.copa.outputs.patched-image }}"

      - name: Fix ownership of Copa OpenVEX output
        # copa-action executes copa inside a Docker container that runs as
        # root with the workspace bind-mounted at /data, so the OpenVEX file
        # it writes is owned by root with permissions the runner user cannot
        # read. That makes actions/upload-artifact fail with
        # "EACCES: permission denied" while zipping the artifact. Normalize
        # ownership/permissions before the upload (passwordless sudo on
        # GitHub-hosted runners).
        if: ${{ steps.vulns.outputs.count != '0' }}
        shell: bash
        run: |
          sudo chown "$(id -u):$(id -g)" vex-report.json
          sudo chmod 644 vex-report.json

      - name: Upload OpenVEX remediation record
        if: ${{ steps.vulns.outputs.count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vex-report
          path: vex-report.json
          if-no-files-found: warn

      - name: Select final image (Copa-patched or original)
        id: final
        shell: bash
        env:
          REPO: ${{ env.IMAGE_REPO }}
          SHA_TAG: ${{ github.sha }}
          VULN_COUNT: ${{ steps.vulns.outputs.count }}
        run: |
          set -euo pipefail
          if [[ "$VULN_COUNT" == "0" ]]; then
            final_image="${REPO}:${SHA_TAG}"
          else
            # copa ran (and any failure would have already failed the job).
            final_image="${REPO}:copa-${SHA_TAG}"
          fi
          echo "final_image=${final_image}" >> "$GITHUB_OUTPUT"

      # Release gate: fail if fixable HIGH/CRITICAL OS vulnerabilities remain
      # after patching. Failed promotion means the release/latest tags are never
      # applied.
      - name: Verify final image has no remaining HIGH/CRITICAL OS vulns
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.final.outputs.final_image }}
          format: table
          scanners: vuln
          vuln-type: os
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      # Functional smoke test of the final image (original or Copa-patched),
      # run exactly the way consumers run this image (see README "Running"):
      # with the data & log directories mounted as tmpfs. The stock base image
      # aborts on tmpfs ("Direct open file ... failed with error 22"), so a
      # successful start + query proves the O_DIRECT-stripping preload hook is
      # configured AND effective, and that the Copa patch layer has not broken
      # any of it. Failing here blocks promotion of the release tags, same as
      # the vulnerability gate above.
      - name: Smoke test final image with tmpfs volumes
        shell: bash
        env:
          IMAGE: ${{ steps.final.outputs.final_image }}
          SA_PASSWORD: 'T3mpfs-Sm0ke-Test!'
        run: |
          set -euo pipefail

          name=smoke-tmpfs

          cleanup() {
            rc=$?
            if [[ $rc -ne 0 ]]; then
              echo "Smoke test failed with rc=${rc}; last 40 container log lines:"
              docker logs "$name" 2>&1 | tail -n 40 || true
            fi
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$name" \
            --tmpfs /var/opt/mssql/data:uid=10001,gid=10001,size=4G \
            --tmpfs /var/opt/mssql/log:uid=10001,gid=10001,size=1G \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            "$IMAGE"

          echo "1/4: data & log directories are backed by tmpfs"
          test "$(docker exec "$name" stat -f -c %T /var/opt/mssql/data)" = tmpfs
          test "$(docker exec "$name" stat -f -c %T /var/opt/mssql/log)" = tmpfs

          echo "2/4: O_DIRECT-stripping preload hook is configured"
          docker exec "$name" cat /etc/ld.so.preload | grep -q 'nodirect_open.so'

          echo "3/4: SQL Server reaches a queries-ready state on tmpfs storage"
          sqlcmd="$(docker exec "$name" sh -c 'ls /opt/mssql-tools*/bin/sqlcmd 2>/dev/null | head -n1')"
          test -n "$sqlcmd"
          started=''
          for _ in $(seq 1 30); do
            if docker exec "$name" "$sqlcmd" -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q 'SELECT 1;' >/dev/null 2>&1; then
              started=yes
              break
            fi
            sleep 10
          done
          if [[ -z "$started" ]]; then
            echo "::error::SQL Server failed to reach a queries-ready state within 300s."
            exit 1
          fi

          echo "4/4: the actual database files land on the tmpfs mount"
          test "$(docker exec "$name" stat -f -c %T /var/opt/mssql/data/master.mdf)" = tmpfs

          echo "Smoke test passed: SQL Server is serving queries with its database files on tmpfs."

      - name: Promote image-tag/latest tags to final image
        shell: bash
        env:
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          FINAL_IMAGE: ${{ steps.final.outputs.final_image }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          args=( -t "${IMAGE_REPO}:${IMAGE_TAG}" )
          if [[ "$REF" == "refs/heads/master" ]]; then
            args+=( -t "${IMAGE_REPO}:latest" )
          fi
          # Server-side manifest copy (no image download): points the promoted
          # tags at the exact manifest of the final image.
          docker buildx imagetools create "${args[@]}" "$FINAL_IMAGE"
